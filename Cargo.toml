[workspace]
resolver = "2"
members = ["crates/sc-core", "crates/sc-envelope", "crates/sc-vocab", "crates/sc-cli", "crates/sc-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zachshallbetter/semantic-core"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
time = { version = "0.3", features = ["parsing", "formatting"] }
ulid = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
