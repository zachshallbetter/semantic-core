name: Feature request
description: Propose a capability, predicate, command or integration.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        The definition of record is [docs/semantic-core-definition-v0.2.2.md](https://github.com/zachshallbetter/semantic-core/blob/main/docs/semantic-core-definition-v0.2.2.md)
        and the stage plan is [docs/ROADMAP.md](https://github.com/zachshallbetter/semantic-core/blob/main/docs/ROADMAP.md). Say where your idea fits.
  - type: textarea
    id: problem
    attributes:
      label: The behavior you want
      description: What should the substrate do? What is the use case?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
      description: A command, a predicate, an API, or a fixture that would prove it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
