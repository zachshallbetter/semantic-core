name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --locked || cargo build --workspace
      - run: cargo test --workspace
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests (skipped until the package exists)
        run: |
          if [ -f swift/SemanticCore/Package.swift ]; then
            swift test --package-path swift/SemanticCore
          else
            echo "no Swift package yet"
          fi
