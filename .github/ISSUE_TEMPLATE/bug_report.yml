name: Bug report
description: The core, the CLI, the C ABI or the Swift package is not behaving as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A minimal reproduction is the fastest path to a fix. Report security issues privately, not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, or the commit if you built from source.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - sc-envelope
        - sc-vocab
        - sc-core
        - sc-cli
        - sc-ffi
        - Swift package (SemanticCore)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened. Quote the definition or roadmap section if relevant.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The commands you ran or a failing fixture or test.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS and version, Rust version, Swift version
